<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha SPA</title>
    <!-- Linkando o CSS -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.min.css">
    
    <!-- Integração da Biblioteca Externa via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navegação Estática -->
    <header>
        <div class="logo-container">
            <img src="../imagens/logo.webp" alt="Logotipo do Sistema" id="logo-principal">
        </div>
        <!-- Landmark de navegação acessível -->
        <nav aria-label="Menu de navegação principal">
            <button id="nav-home">Home</button>
            <button id="nav-form">Cadastro</button>
        </nav>
    </header>

    <!-- Landmark principal: O conteúdo será injetado nesta tag main em vez de uma div -->
    <main id="app"></main>

    <!-- Linkando o JS principal como módulo -->
    <script type="module" src="../js/main.min.js"></script>
</body>
</html>
